[alembic]
script_location = alembic
prepend_sys_path = .
# The database URL is read from .env (DATABASE_URL) in alembic/env.py,
# not written here, so production passwords never sit in this file.
#
# Keep this file ASCII-only. Alembic reads it with encoding="locale",
# so on a Korean Windows machine (cp949) any Hangul here makes every
# alembic command fail with UnicodeDecodeError.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
