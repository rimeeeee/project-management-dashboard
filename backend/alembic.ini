[alembic]
script_location = alembic
prepend_sys_path = .
# 데이터베이스 주소는 alembic/env.py 에서 .env 의 DATABASE_URL 을 읽어 씁니다.
# 여기에 적지 않습니다 (운영 비밀번호가 파일에 남지 않도록).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
