# 배포 환경이 정해지면 이 파일로 올립니다.
#   docker compose up -d --build
#
# 지금 개발 PC 에는 Docker 가 없어서 이 구성은 아직 실행해 보지 못했습니다.
# 서버가 정해지면 가장 먼저 이 구성으로 한 번 띄워 확인해야 합니다.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bizdash
      POSTGRES_USER: bizdash
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 .env 에 넣어 주세요}
      TZ: Asia/Seoul
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bizdash"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://bizdash:${POSTGRES_PASSWORD}@db:5432/bizdash
      APP_PASSWORD_HASH: ${APP_PASSWORD_HASH}
      SECRET_KEY: ${SECRET_KEY}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: ""
      # 공고 자동 수집. 기본은 꺼져 있고 화면의 [지금 수집] 으로만 받습니다.
      # 자동으로 돌리려면 true. 서버를 여러 대로 늘리면 한 대에서만 켜세요.
      COLLECTOR_ENABLED: ${COLLECTOR_ENABLED:-false}
      COLLECTOR_CRON: ${COLLECTOR_CRON:-0 6 * * 1,4}
      TZ: Asia/Seoul
    ports:
      - "8000:8000"

volumes:
  pgdata:
